name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Pi server and package builder
        run: python3 -m unittest discover -s tests
      - name: Test gestures and menu texts
        run: node --test tests/gesture.test.js tests/i18n.test.js

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the Debian package
        run: python3 packaging/deb/build_deb.py --output dist/deb
      - name: Inspect the package
        run: |
          dpkg-deb --info dist/deb/*.deb
          dpkg-deb --contents dist/deb/*.deb
      - name: Lint (informational)
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian
          lintian --no-tag-display-limit dist/deb/*.deb || true
      - name: Install, check and purge
        run: |
          # Chromium comes from a snap on Ubuntu, so ignore dependencies here; the point
          # is to run the maintainer scripts on a Debian-family system with systemd.
          # The service directories are not readable for the runner user, so inspect them with sudo.
          # Every failed check is reported as an annotation, which is readable without a login.
          fail=0
          check() {
            description=$1; shift
            if "$@" >/dev/null 2>&1; then echo "ok: $description"; else echo "::error::check failed: $description"; fail=1; fi
          }
          if ! sudo dpkg -i --force-depends dist/deb/*.deb > install.log 2>&1; then
            cat install.log
            echo "::error::dpkg -i failed: $(tail -n 8 install.log | tr '\n' '|')"
            exit 1
          fi
          cat install.log
          check "service user exists" id marqueepi
          check "config is root:marqueepi 640" test "$(sudo stat -c '%U:%G %a' /etc/marquee-pi/config.json)" = "root:marqueepi 640"
          check "token placeholder replaced" sudo sh -c '! grep -q CHANGE_ME /etc/marquee-pi/config.json'
          check "token has 64 characters" sudo python3 -c "import json; c = json.load(open('/etc/marquee-pi/config.json')); assert len(c['token']) == 64"
          check "data directory is marqueepi:marqueepi 750" test "$(sudo stat -c '%U:%G %a' /var/lib/marquee-pi)" = "marqueepi:marqueepi 750"
          check "kiosk script is executable" test -x /opt/marquee-pi/start-kiosk.sh
          check "api unit is known to systemd" systemctl cat marquee-pi-api.service
          check "api unit is enabled" systemctl is-enabled marquee-pi-api.service
          if ! sudo dpkg -P marquee-pi > purge.log 2>&1; then
            cat purge.log
            echo "::error::dpkg -P failed: $(tail -n 8 purge.log | tr '\n' '|')"
            exit 1
          fi
          cat purge.log
          check "service user removed" sh -c '! id marqueepi'
          check "config removed" test ! -e /etc/marquee-pi
          check "data removed" test ! -e /var/lib/marquee-pi
          check "program removed" test ! -e /opt/marquee-pi
          exit $fail

  deb-debian:
    # A real Debian 13 (the base of Raspberry Pi OS Trixie): apt must pull in every
    # dependency of the package and the programs the scripts call must exist afterwards.
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Prepare the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates
      - uses: actions/checkout@v4
      - name: Build the Debian package
        run: python3 packaging/deb/build_deb.py --output dist/deb
      - name: Install with apt, check and purge
        run: |
          fail=0
          check() {
            description=$1; shift
            if "$@" >/dev/null 2>&1; then echo "ok: $description"; else echo "::error::check failed: $description"; fail=1; fi
          }
          if ! apt-get install -y --no-install-recommends ./dist/deb/marquee-pi_*_all.deb > install.log 2>&1; then
            tail -n 40 install.log
            echo "::error::apt-get install failed: $(tail -n 8 install.log | tr '\n' '|')"
            exit 1
          fi
          tail -n 25 install.log
          check "package is installed" sh -c 'dpkg -s marquee-pi | grep -q "^Status: install ok installed"'
          for program in python3 ffprobe fbi curl xset xrandr xinit Xorg xauth pkcheck openssl hostname awk systemctl chromium; do
            check "dependency provides $program" command -v "$program"
          done
          check "service user exists" id marqueepi
          check "config is root:marqueepi 640" test "$(stat -c '%U:%G %a' /etc/marquee-pi/config.json)" = "root:marqueepi 640"
          check "token placeholder replaced" sh -c '! grep -q CHANGE_ME /etc/marquee-pi/config.json'
          check "polkit rule installed" test -f /usr/share/polkit-1/rules.d/50-marquee-pi.rules
          check "kiosk unit installed" test -f /usr/lib/systemd/system/marquee-pi-kiosk.service
          # Importing as root leaves bytecode in /opt/marquee-pi; removing the package must clean that up.
          check "server module imports" python3 -c "import sys; sys.path.insert(0, '/opt/marquee-pi'); import marquee_pi"
          if ! apt-get purge -y marquee-pi > purge.log 2>&1; then
            cat purge.log
            echo "::error::apt-get purge failed: $(tail -n 8 purge.log | tr '\n' '|')"
            exit 1
          fi
          check "service user removed" sh -c '! id marqueepi'
          check "config removed" test ! -e /etc/marquee-pi
          check "program removed" test ! -e /opt/marquee-pi
          exit $fail

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Check that the app compiles
        shell: msys2 {0}
        run: |
          for file in main settings_ui popups ui_kit thumb_cache pi_sync event_log; do
            g++ -std=c++20 -Wall -Wextra -municode -mwindows -fsyntax-only windows/native/$file.cpp
          done
      - name: Build and run native tests
        shell: msys2 {0}
        run: |
          mkdir -p build/native-tests
          g++ -std=c++20 -O2 -Wall -Wextra -static -static-libgcc -static-libstdc++ \
            windows/native/core.cpp windows/native/strings.cpp windows/native/thumbnail.cpp \
            windows/native/pi_sync.cpp windows/native/event_log.cpp \
            windows/native/tests.cpp \
            -o build/native-tests/Marquee-Pi-tests.exe \
            -lwinhttp -lshell32 -ladvapi32 -lcrypt32 -luser32 -lgdi32 -lole32 -luuid -lws2_32 \
            -lwindowscodecs -lmfplat -lmfreadwrite -lmf -lmfuuid -lpropsys
          touch build/native-tests/portable.flag
          cd build/native-tests
          ./Marquee-Pi-tests.exe
