; Save a copy as %LOCALAPPDATA%\Marquee-Pi\settings.ini.
; Create and set up the token with "Help: create token" in the Windows tool.
[Connection]
PiUrl=http://10.0.0.10:8765
Token=

[Gestures]
SwipeDown=none
SwipeUp=none
SwipeRight=none
SwipeLeft=none
LongPress=touch_menu
RetroArchMenuHotkey=F1
RetroArchMenuMode=keyboard
RetroArchNetworkPort=55355

[General]
StartWithWindows=false
; auto = follow the Windows display language, or en / de. Also sets the Pi touch menu language.
Language=auto
; dark, light or auto (follow the Windows app theme)
Theme=dark
; sidebar or tabs
Navigation=sidebar
