<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Marquee-Pi</title>
  <style>
    html, body, #stage { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; cursor: none; }
    #stage { display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; }
    #stage img, #stage video { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    #name { position: absolute; inset: auto 1rem 1rem; color: white; text-align: center; font: 1.5rem sans-serif; text-shadow: 0 2px 8px black; pointer-events: none; }
    #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.72); font: 20px sans-serif; color: #f2f2f2; touch-action: manipulation; user-select: none; }
    #menu[hidden] { display: none; }
    #menu .panel { box-sizing: border-box; width: 96%; max-height: 96%; overflow: hidden; padding: 14px 18px; background: #1b1b1f; border: 1px solid #3a3a42; border-radius: 14px; }
    #menu .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 24px; font-weight: bold; }
    #menu .head .title { flex: 1; }
    #menu button.system, #menu button.back { flex: 0 0 auto; min-width: 120px; }
    #menu .row.big button { min-height: 96px; }
    #menu .row.big .confirm { font-size: 22px; }
    #menu .section { margin: 10px 0 4px; font-size: 15px; color: #9a9aa6; text-transform: uppercase; letter-spacing: 0.06em; }
    #menu .row { display: flex; gap: 8px; align-items: center; }
    #menu button { flex: 1; min-height: 56px; padding: 0 10px; font: inherit; color: inherit; background: #2c2c33; border: 2px solid #44444e; border-radius: 10px; }
    #menu button:active { background: #45454f; }
    #menu button[disabled] { opacity: 0.35; }
    #menu button.selected { background: #1f5fbf; border-color: #5c9bff; }
    #menu button.danger { border-color: #a04040; }
    #menu button.close { flex: 0 0 56px; }
    #menu .level { flex: 2; text-align: center; font-size: 22px; }
    #menu .status { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 18px; }
    #menu .status span:nth-child(odd) { color: #9a9aa6; }
    #menu .confirm { flex: 3; text-align: center; }
  </style>
</head>
<body>
  <main id="stage" aria-label="Arcade display"></main>
  <div id="menu" hidden></div>
  <script src="/ui/gesture.js"></script>
  <script src="/ui/app.js"></script>
</body>
</html>
